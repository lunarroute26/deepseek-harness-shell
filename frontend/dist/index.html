<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>deepseek harness shell</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="stage">
    <div class="logo" aria-hidden="true">
      <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="72" height="72" rx="18" fill="#1f1f24"/>
        <path d="M26 46V26h8v20h-8Zm12 0V26h8v20h-8Zm12 0V26h8v20h-8Z" fill="#4d7cfe"/>
      </svg>
    </div>
    <h1>deepseek harness shell</h1>
    <p id="status" class="status">正在启动本地服务…</p>
    <div id="error" class="error" hidden>
      <p id="errorMsg"></p>
      <button id="retry" type="button">重新启动</button>
    </div>
  </main>

  <script type="module">
    import { Events } from "/wails/runtime.js";

    const statusEl = document.getElementById('status');
    const errorBox = document.getElementById('error');
    const errorMsg = document.getElementById('errorMsg');
	const retryButton = document.getElementById('retry');

	function eventData(event) {
	  return event && Object.hasOwn(event, 'data') ? event.data : event;
	}

	function showStatus(message) {
	  statusEl.textContent = String(message || '正在启动本地服务...');
	  errorBox.hidden = true;
	  retryButton.disabled = true;
	}

    function showError(msg) {
      statusEl.textContent = '启动失败';
      errorMsg.textContent = msg || '未知错误';
      errorBox.hidden = false;
	  retryButton.disabled = false;
    }

	Events.On('dsh:status', (event) => showStatus(eventData(event)));
	Events.On('dsh:ready', (event) => {
	  const url = eventData(event);
	  if (url) window.location.href = String(url);
	});
	Events.On('dsh:error', (event) => showError(String(eventData(event) || '未知错误')));

	retryButton.addEventListener('click', async () => {
	  retryButton.disabled = true;
	  showStatus('正在重试...');
	  try {
		await Events.Emit('dsh:retry');
	  } catch (error) {
		showError(error instanceof Error ? error.message : String(error));
	  }
    });

	// All listeners are active before the backend is allowed to launch dsh.
	await Events.Emit('dsh:splash-ready');
  </script>
</body>
</html>
