# 三平台原生构建 + 发布制品（GitHub Actions）
# 每个平台在自己的 runner 上原生构建，避免 CGO 交叉编译问题。
#
# 触发方式：
#   - push tag v*（如 v0.1.0）：构建四平台制品 + 生成 SHA256SUMS + 创建 GitHub Release
#   - workflow_dispatch：仅构建并上传 artifacts，不创建 Release
#
# 制品（双轨制）：
#   - 安装包：macOS .dmg / Windows NSIS installer（首次安装使用）
#   - 更新包：zip / tar.gz 单顶层条目（应用内 updater 使用；updater 不支持 dmg/msi）
# 更新包命名需满足 updater 的 AssetMatcher 约定：
#   <name>-<goos>-<goarch>.zip|.tar.gz （darwin/linux/windows + amd64/arm64 会被自动识别）
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: deepseek-harness-shell-darwin-arm64
            goos: darwin
            goarch: arm64
          - os: macos-latest
            artifact: deepseek-harness-shell-darwin-amd64
            goos: darwin
            goarch: amd64
          - os: windows-latest
            artifact: deepseek-harness-shell-windows-amd64
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            artifact: deepseek-harness-shell-linux-amd64
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install Linux system deps (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      # wails3 CLI：darwin/windows 打包链需要（generate icons/syso/bootstrapper、tool package）
      - name: Install wails3 CLI
        if: runner.os != 'Linux'
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="0.1.0-dev"
          echo "==> building $GOOS/$GOARCH version=$VERSION"
          case "$GOOS" in
            darwin)
              # 模板打包链：build -> create:app:bundle(ad-hoc 签名) -> create:dmg
              # 产物固定：bin/deepseek-harness-shell(.app/.dmg)；BUILD_FLAGS 需完整覆盖模板默认
              wails3 task darwin:package:dmg \
                "BUILD_FLAGS=-tags production -trimpath -buildvcs=false -ldflags=\"-w -s -X main.version=${VERSION}\"" \
                ARCH=$GOARCH
              ;;
            windows)
              # 模板构建：产出 bin/deepseek-harness-shell.exe（-H windowsgui 无控制台窗口）
              wails3 task windows:build \
                "BUILD_FLAGS=-tags production -trimpath -buildvcs=false -ldflags=\"-w -s -H windowsgui -X main.version=${VERSION}\"" \
                ARCH=$GOARCH
              ;;
            linux)
              # Wails v3 在 Linux 上必须 CGO（WebKitGTK 绑定）
              CGO_ENABLED=1 go build -tags production -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "bin/${{ matrix.artifact }}" .
              ;;
          esac
          ls -la bin/

      # Windows 专属：NSIS 安装器（含 WebView2 bootstrapper）
      - name: Create NSIS installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nsis -y
          export PATH="$PATH:/c/Program Files (x86)/NSIS:/c/Program Files/NSIS"
          wails3 task windows:create:nsis:installer \
            "BUILD_FLAGS=-tags production -trimpath -buildvcs=false -ldflags=\"-w -s -H windowsgui -X main.version=${VERSION}\"" \
            ARCH=$GOARCH
          ls -la build/windows/nsis/

      # 组装发布资产
      - name: Package
        shell: bash
        run: |
          cd bin
          case "${{ matrix.goos }}" in
            darwin)
              # 安装包：.dmg；更新包：.app 的 zip（单顶层条目）
              cp deepseek-harness-shell.dmg "${{ matrix.artifact }}.dmg"
              tar -a -c -f "${{ matrix.artifact }}.zip" deepseek-harness-shell.app
              ;;
            windows)
              # 安装包：NSIS installer；更新包：exe 的 tar.gz
              mv deepseek-harness-shell.exe "${{ matrix.artifact }}.exe"
              tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}.exe"
              cp ../build/windows/nsis/deepseek-harness-shell-installer.exe "${{ matrix.artifact }}-installer.exe"
              ;;
            linux)
              tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
              ;;
          esac
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/*.zip
            bin/*.tar.gz
            bin/*.dmg
            bin/*-installer.exe
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -x
          cd dist
          ls -la
          # 幂等：release 已存在则只补传资产，否则创建
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
