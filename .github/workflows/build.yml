# 三平台原生构建 + 发布制品（GitHub Actions）
# 每个平台在自己的 runner 上原生构建，避免 CGO 交叉编译问题。
#
# 触发方式：
#   - push tag v*（如 v0.1.0）：构建四平台制品 + 生成 SHA256SUMS + 创建 GitHub Release
#   - workflow_dispatch：仅构建并上传 artifacts，不创建 Release
#
# 制品命名需满足 updater 的 AssetMatcher 约定：
#   <name>-<goos>-<goarch>.zip|.tar.gz （darwin/linux/windows + amd64/arm64 会被自动识别）
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: deepseek-harness-shell-darwin-arm64
            goos: darwin
            goarch: arm64
          - os: macos-latest
            artifact: deepseek-harness-shell-darwin-amd64
            goos: darwin
            goarch: amd64
          - os: windows-latest
            artifact: deepseek-harness-shell-windows-amd64
            goos: windows
            goarch: amd64
          - os: ubuntu-latest
            artifact: deepseek-harness-shell-linux-amd64
            goos: linux
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install Linux system deps (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Wails v3 在 macOS/Linux 上必须启用 CGO（Cocoa / WebKitGTK 绑定）
          CGO_ENABLED=0
          if [ "$GOOS" = "darwin" ] || [ "$GOOS" = "linux" ]; then
            CGO_ENABLED=1
          fi
          # 版本号：tag 去掉 v 前缀（如 v0.1.0 -> 0.1.0）；手动触发时为 dev 版本
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="0.1.0-dev"; fi
          echo "Building $GOOS/$GOARCH version=$VERSION (CGO_ENABLED=$CGO_ENABLED)"
          CGO_ENABLED=$CGO_ENABLED go build -tags production -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o bin/${{ matrix.artifact }} .
          ls -la bin

      # 打包成 updater 支持的格式（zip / tar.gz，单顶层条目）
      # 注意：Windows runner 的 Git Bash 自带 GNU tar，不支持 `-a` 自动压缩成 .zip
      # （GNU tar 只认 gzip/xz 等；能生成 zip 的是 macOS 的 bsdtar）。
      # 因此 Windows 统一用 tar.gz —— updater 同时支持 zip 和 tar.gz，AssetMatcher
      # 只按文件名中的 goos/goarch 子串匹配，不受扩展名影响。
      - name: Package
        shell: bash
        run: |
          cd bin
          case "${{ matrix.goos }}" in
            windows)
              # go build 在 Windows 上会输出 <name>.exe，统一去掉后缀
              if [ -f "${{ matrix.artifact }}.exe" ]; then
                mv "${{ matrix.artifact }}.exe" "${{ matrix.artifact }}"
              fi
              tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}" ;;
            darwin)
              # macOS 自带 bsdtar，支持 -a 按扩展名选压缩器（zip）
              tar -a -c -f "${{ matrix.artifact }}.zip" "${{ matrix.artifact }}" ;;
            linux)
              tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}" ;;
          esac
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/*.zip
            bin/*.tar.gz
          if-no-files-found: error

  # 只有 tag 推送才创建 Release：合并四平台制品 + SHA256SUMS
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          echo "===== SHA256SUMS ====="
          cat SHA256SUMS

      # 幂等创建 Release：若 tag 已有 Release 则只补传资产，否则创建。
      # set -x 输出详细命令，便于在 Actions 日志中排查。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -x
          cd dist
          ls -la
          echo "ref_name=$GITHUB_REF_NAME"
          gh --version
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
