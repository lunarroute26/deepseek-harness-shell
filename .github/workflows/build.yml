# 三平台原生构建 + 发布制品（GitHub Actions）
# 每个平台在自己的 runner 上原生构建，避免 CGO 交叉编译问题。
#
# 触发方式：
#   - push tag v*（如 v0.1.1）：构建三平台制品 + 生成 SHA256SUMS + 创建 GitHub Release
#   - workflow_dispatch：仅构建并上传 artifacts，不创建 Release
#
# 制品（双轨制）：
#   - 安装包：macOS .dmg / Windows NSIS installer（首次安装使用）
#   - macOS 更新包：包含完整 .app（含 payload）的 zip
# Windows/Linux 的 payload 是 sidecar 目录，Wails updater 不能原子更新它，
# 因此这两个平台只发布完整安装产物，不发布单 exe 更新包。
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: deepseek-harness-shell-darwin-arm64
            goos: darwin
            goarch: arm64
            nodearch: arm64
          - os: macos-latest
            artifact: deepseek-harness-shell-darwin-amd64
            goos: darwin
            goarch: amd64
            nodearch: x64
          - os: windows-latest
            artifact: deepseek-harness-shell-windows-amd64
            goos: windows
            goarch: amd64
            nodearch: x64
          - os: ubuntu-latest
            artifact: deepseek-harness-shell-linux-amd64
            goos: linux
            goarch: amd64
            nodearch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout DeepSeek Harness
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: 47f943859bef60e4160492346772ded9b24f765a
          path: deepseek-harness

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          architecture: ${{ matrix.nodearch }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Install Linux system deps (WebKitGTK and packaging)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev rpm

      - name: Install wails3 CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build DeepSeek Harness
        working-directory: deepseek-harness
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Test packaging helpers
        shell: bash
        run: node --test scripts/*.test.mjs

      - name: Stage production payload
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          node scripts/stage-payload.mjs \
            --repo "$GITHUB_WORKSPACE/deepseek-harness" \
            --node "$(node -p 'process.execPath')" \
            --out "build/payload/${GOOS}-${GOARCH}" \
            --platform "$GOOS" \
            --arch "$GOARCH"
          node scripts/verify-payload.mjs \
            --root "build/payload/${GOOS}-${GOARCH}" \
            --platform "$GOOS" \
            --arch "$GOARCH"
          node scripts/smoke-payload.mjs \
            --root "build/payload/${GOOS}-${GOARCH}"
          node scripts/verify-packaging.mjs

      - name: Set version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.1-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          echo "==> building $GOOS/$GOARCH version=$VERSION"
          case "$GOOS" in
            darwin)
              # 模板打包链：build -> create:app:bundle(ad-hoc 签名) -> create:dmg
              # 产物固定：bin/deepseek-harness-shell(.app/.dmg)；BUILD_FLAGS 需完整覆盖模板默认
              wails3 task darwin:package:dmg \
                "BUILD_FLAGS=-tags production -trimpath -buildvcs=false -ldflags=\"-w -s -X main.version=${VERSION}\"" \
                ARCH=$GOARCH
              ;;
            windows)
              # Wails beta.8's Task fingerprinting follows the physical pnpm
              # tree on Windows. Build the checked-in frontend directly while
              # the production payload is parked outside the workspace.
              payload_dir="$GITHUB_WORKSPACE/build/payload/windows-${GOARCH}"
              parked_payload="$RUNNER_TEMP/deepseek-harness-shell-windows-${GOARCH}-payload"
              mv "$payload_dir" "$parked_payload"
              restore_windows_payload() {
                if [[ -d "$parked_payload" ]]; then
                  mv "$parked_payload" "$payload_dir"
                fi
              }
              trap restore_windows_payload EXIT
              wails3 generate syso \
                -arch "$GOARCH" \
                -icon build/windows/icon.ico \
                -manifest build/windows/wails.exe.manifest \
                -info build/windows/info.json \
                -out "wails_windows_${GOARCH}.syso"
              CGO_ENABLED=0 go build \
                -tags production \
                -trimpath \
                -buildvcs=false \
                -ldflags "-w -s -H windowsgui -X main.version=${VERSION}" \
                -o bin/deepseek-harness-shell.exe
              rm -f "wails_windows_${GOARCH}.syso"
              restore_windows_payload
              trap - EXIT
              ;;
            linux)
              wails3 task linux:build \
                "BUILD_FLAGS=-tags production -trimpath -buildvcs=false -ldflags=\"-w -s -X main.version=${VERSION}\"" \
                ARCH=$GOARCH
              ;;
          esac
          ls -la bin/

      # Windows 专属：NSIS 安装器（含 WebView2 bootstrapper）
      - name: Create NSIS installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          choco install nsis -y
          export PATH="$PATH:/c/Program Files (x86)/NSIS:/c/Program Files/NSIS"
          wails3 task windows:create:nsis:installer:from-build ARCH=$GOARCH
          ls -la build/windows/nsis/

      - name: Verify installed NSIS payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "bin/*-installer.exe" | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not generated" }
          $installDir = Join-Path $env:RUNNER_TEMP "deepseek harness shell smoke"
          $process = Start-Process -FilePath $installer.FullName `
            -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)" }
          if (-not (Test-Path "$installDir/deepseek-harness-shell.exe")) {
            throw "installed application executable is missing"
          }
          node scripts/verify-payload.mjs `
            --root "$installDir/payload" --platform windows --arch "${{ matrix.goarch }}"
          node scripts/smoke-payload.mjs --root "$installDir/payload" --server

      - name: Create Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          wails3 task linux:create:appimage ARCH=$GOARCH
          wails3 task linux:create:deb ARCH=$GOARCH
          ls -lah bin/

      - name: Verify AppImage payload
        if: runner.os == 'Linux'
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          appimage="$(find bin -maxdepth 1 -name 'deepseek-harness-shell-*.AppImage' -print -quit)"
          test -n "$appimage"
          extract_dir="$RUNNER_TEMP/appimage-extract"
          mkdir -p "$extract_dir"
          (
            cd "$extract_dir"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          appdir="$extract_dir/squashfs-root"
          test -x "$appdir/AppRun"
          test -x "$appdir/usr/bin/deepseek-harness-shell"
          node scripts/verify-payload.mjs \
            --root "$appdir/usr/bin/payload" --platform linux --arch "$GOARCH"
          node scripts/smoke-payload.mjs \
            --root "$appdir/usr/bin/payload" --server
          if ldd "$appdir/usr/bin/deepseek-harness-shell" | grep -q 'not found'; then
            echo "AppImage executable has unresolved shared libraries" >&2
            exit 1
          fi

      # 组装发布资产
      - name: Package
        shell: bash
        run: |
          cd bin
          case "${{ matrix.goos }}" in
            darwin)
              # 安装包带 -installer，旧版 Wails matcher 会跳过它并选择 .app zip。
              mv deepseek-harness-shell.dmg "${{ matrix.artifact }}-installer.dmg"
              ditto -c -k --sequesterRsrc --keepParent \
                deepseek-harness-shell.app "${{ matrix.artifact }}.zip"
              ;;
            windows)
              # 完整 NSIS 安装器，内部包含 exe 与 payload。
              mv ./*-installer.exe "${{ matrix.artifact }}-installer.exe"
              ;;
            linux)
              mv deepseek-harness-shell-*.AppImage "${{ matrix.artifact }}.AppImage"
              mv ./*.deb "${{ matrix.artifact }}.deb"
              ;;
          esac
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            bin/*.zip
            bin/*.tar.gz
            bin/*.dmg
            bin/*-installer.exe
            bin/*.AppImage
            bin/*.deb
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -x
          cd dist
          ls -la
          # 幂等：release 已存在则只补传资产，否则创建
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              if [[ ! -f "$asset" ]]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --yes
              fi
            done < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
